<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunicador predictivo</title>
<style>
/* Tema oscuro fijo y de alto contraste, pensado para una tele vista a 2-3 m. */
:root{
  color-scheme:dark;
  --bg:#0b0b0a; --ink:#ffffff; --muted:#b5b0a6; --card:#1b1a18; --line:#55524b;
  --vowel:#ffc928; --vowel-ink:#000000; --cons:#126b57; --cons-ink:#ffffff;
  --pred:#24221d; --pred-line:#b8973f; --action:#2f4d69; --action-ink:#ffffff;
  --num:#3f4fcf; --num-ink:#ffffff; --danger:#c0392b; --soft:#34322d;
  --go:#1d7042; --focus:#ffffff; --r:1.8vh;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}

/* Márgenes de seguridad de TV: 5% en cada borde */
.app{position:fixed;top:5vh;bottom:5vh;left:5vw;right:5vw;display:grid;
  grid-template-rows:19vh minmax(0,1fr) 9.5vh;gap:2vh}

button{font:inherit;color:inherit;border:none;border-radius:var(--r);cursor:pointer;padding:0;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;outline:none;transition:transform .08s ease-out}
button.pressed{filter:brightness(.8);transform:scale(.96)}
button.off{opacity:.35}
svg{display:block}

/* Foco MUY visible (solo cuando se maneja con control remoto / teclado) */
.kb button:focus,.kb .nav:focus{z-index:20;transform:scale(1.07);opacity:1;
  box-shadow:0 0 0 4px #000,0 0 0 13px var(--focus),0 0 3vh 1.6vh rgba(255,255,255,.45)}
.kb button.off:focus{opacity:.75}
@keyframes bump{0%,100%{translate:0 0}25%{translate:-1vh 0}75%{translate:1vh 0}}
.kb .bump{animation:bump .18s}
.kb .msg:focus{transform:scale(1.02)}
.nav{outline:none}

/* Arriba: mensaje + Hablar / Borrar / Borrar todo */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.6vw;min-height:0}
.msg{background:var(--card);border:.4vh solid var(--line);border-radius:var(--r);padding:1.2vh 1.6vw;
  display:flex;min-height:0}
.msg-text{flex:1;font-size:6vh;font-weight:800;line-height:1.2;word-break:break-word;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
.cur{color:#5fe0bf;text-decoration:underline;text-underline-offset:.6vh}
.empty{color:var(--muted);font-weight:600;font-size:.75em}
.topbtns{display:grid;grid-template-columns:repeat(3,18vh);gap:1.6vw}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;
  font-size:3.6vh;font-weight:800;letter-spacing:.03em;line-height:1}
.tb svg{width:8vh;height:8vh}
.speak{background:var(--go);color:#fff}
.del{background:var(--action);color:var(--action-ink)}
.trash{background:var(--soft)}
.trash.armed{background:var(--danger);color:#fff}

/* Medio: palabra + predicciones a la izquierda, teclado a la derecha */
.mid{display:grid;grid-template-columns:36fr 64fr;gap:2.4vw;min-height:0}
.left{display:grid;grid-template-rows:1fr 3fr;gap:1.6vh;min-height:0}
.curword{background:var(--card);border:.5vh solid #5fe0bf;border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;padding:0 1vw;min-height:0;
  font-size:8vh;font-weight:800;letter-spacing:.05em;color:#5fe0bf;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.curword.idle{border-color:var(--line);color:var(--muted);font-size:5vh}
.preds{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:1.6vh;min-height:0}
.pred{background:var(--pred);border:.4vh solid var(--pred-line);font-weight:800;font-size:5.6vh;
  padding:0 1vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:0}
.pred.blank{visibility:hidden}

.main{min-height:0;display:flex;flex-direction:column;gap:1.6vh}
.strip{flex:none;height:9vh;font-weight:800;font-size:4.4vh;background:var(--soft)}
.grid{flex:1;min-height:0;display:grid;gap:1.6vh}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.vowel{background:var(--vowel);color:var(--vowel-ink)}
.cons{background:var(--cons);color:var(--cons-ink)}
.numk{background:var(--num);color:var(--num-ink);font-size:7vh;font-weight:800}
.numgrid{grid-template-rows:repeat(5,1fr)}
.abc{background:var(--soft);font-weight:800;font-size:5.5vh}
.phrase{background:var(--pred);border:.4vh solid var(--pred-line);font-weight:800;font-size:4.2vh;
  line-height:1.15;padding:.5vh .8vw}
.short{background:var(--pred);border:.4vh solid var(--pred-line);font-weight:800;font-size:4.2vh;
  padding:0 .5vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.enter{background:var(--go);color:#fff;display:flex;align-items:center;justify-content:center}
.lab{display:flex;flex-direction:column;align-items:center;gap:.4vh;font-size:4vh;font-weight:800}
.lab svg{width:6vh;height:6vh}

/* Círculo / grilla de letras (igual que la versión táctil) */
.ringwrap{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.ring{position:relative;width:100cqmin;height:100cqmin}
.ring button{position:absolute;display:flex;align-items:center;justify-content:center}
.rl{border-radius:50%;font-weight:800;font-size:16cqmin;line-height:1}
.rg{font-weight:800;font-size:14cqmin;line-height:1}
.rc{right:0;top:34.4%;width:20%;height:31.2%;background:var(--num);color:var(--num-ink);font-weight:800;font-size:8cqmin}
.rmore{right:0;top:0;width:20%;height:31.2%;background:var(--action);color:var(--action-ink)}
.renter{right:0;bottom:0;width:20%;height:31.2%}
.ring .lab{font-size:4.6cqmin;gap:.6cqmin}
.ring .lab svg{width:9cqmin;height:9cqmin}

/* Abajo: Frases / Palabras / Mostrar */
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4vw}
.bar button{background:var(--soft);font-weight:800;font-size:4.6vh}
.bar button.on{background:var(--action);color:var(--action-ink)}

/* Mensaje en grande */
.overlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;gap:3vh;padding:5vh 5vw}
.overlay.on{display:flex}
.ov-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;
  font-size:12vh;line-height:1.1;word-break:break-word;min-height:0;overflow:hidden}
.ov-bar{display:grid;grid-template-columns:1fr 1fr;gap:3vw;height:15vh;flex:none}
.ov-bar button{background:var(--action);color:var(--action-ink);font-weight:800;font-size:5.5vh}
.ov-bar button.speak{background:var(--go)}

.toast{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);max-width:80vw;z-index:50;
  background:#fff;color:#000;font-size:4vh;font-weight:700;line-height:1.3;text-align:center;
  padding:2vh 3vw;border-radius:var(--r);box-shadow:0 1vh 4vh rgba(0,0,0,.6);display:none}
.toast.on{display:block}

/* ===== Plataforma: celular / tablet en VERTICAL =====
   Adaptación aparte: solo se aplica en pantallas verticales. La tele y el horizontal no cambian.
   Disposición en columna: mensaje, botones, palabra, predicciones en fila, letras y barra. */
@media (orientation: portrait){
  .app{top:max(1.5vh, env(safe-area-inset-top));bottom:max(1.5vh, env(safe-area-inset-bottom));left:3vw;right:3vw;
    grid-template-rows:auto minmax(0,1fr) 7vh;gap:1.2vh}
  .top{grid-template-columns:1fr;grid-template-rows:12vh 7.5vh;gap:1.2vh}
  .msg{border-width:.3vh;padding:.8vh 2.5vw}
  .msg-text{font-size:3.4vh}
  .topbtns{grid-template-columns:repeat(3,1fr);gap:2vw}
  .tb{flex-direction:row;gap:1.5vw;font-size:2.3vh}
  .tb svg{width:3.6vh;height:3.6vh}

  .mid{display:flex;flex-direction:column;gap:1.2vh}
  .left{display:flex;flex-direction:column;gap:1.2vh;flex:none}
  .curword{height:7.5vh;flex:none;font-size:5vh;border-width:.35vh}
  .curword.idle{font-size:3.2vh}
  .preds{grid-template-rows:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vw;height:7.5vh}
  .pred{font-size:2.7vh;border-width:.3vh;padding:0 1.5vw}
  .main{flex:1;gap:1.2vh}
  .preds.other{display:none}   /* en Frases / Palabras / Números no hay predicciones: no dejar el hueco */

  .strip{height:6vh;font-size:3vh}
  .grid{gap:1.2vh}
  .grid.g3:not(.numgrid){grid-template-columns:1fr 1fr}
  .grid.g4{grid-template-columns:repeat(3,1fr)}
  .phrase{font-size:2.5vh;border-width:.3vh}
  .short{font-size:2.5vh;border-width:.3vh}
  .numk{font-size:4.5vh}
  .abc{font-size:3.4vh}
  .lab{font-size:2.4vh}
  .lab svg{width:3.6vh;height:3.6vh}

  .bar{gap:2vw}
  .bar button{font-size:2.8vh}

  .overlay{padding:3vh 4vw}
  .ov-text{font-size:6.5vh}
  .ov-bar{height:9vh}
  .ov-bar button{font-size:3vh}
  .toast{font-size:2.4vh;bottom:10vh;max-width:92vw}
  :root{--r:1.4vh}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="msg nav" id="msgbox" data-k="msg" tabindex="-1" aria-label="Mensaje. OK para hablar"><div class="msg-text" id="msg" aria-live="polite"></div></div>
    <div class="topbtns" id="topbtns"></div>
  </div>
  <div class="mid">
    <div class="left">
      <div class="curword" id="cur"></div>
      <div class="preds" id="preds"></div>
    </div>
    <div class="main" id="main"></div>
  </div>
  <div class="bar" id="bar"></div>
</div>
<div class="overlay" id="ov" role="dialog" aria-label="Mensaje en grande">
  <div class="ov-text" id="ovText"></div>
  <div class="ov-bar" id="ovBar"></div>
</div>
<div class="toast" id="toast" role="status"></div>

// ---------- Utilidades ----------
function norm(s){
  return String(s).toLowerCase().replace(/ñ/g,"\u0001").normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/\u0001/g,"ñ").replace(/[^a-zñ0-9.]/g,"");
}
function isNum(w){ return /^[0-9.]+$/.test(w); }
var VOWELS = ["a","e","i","o","u"];
var ALL = "abcdefghijklmnñopqrstuvwxyz".split("");
var CONS = ALL.filter(function(c){ return VOWELS.indexOf(c) < 0; });

// ---------- Vocabulario ----------
var vocab = {}; // norm -> {d: forma con tildes, w: peso}
function addWord(display, w, keepDisplay){
  var n = norm(display); if (!n || isNum(n)) return;
  if (!vocab[n]){ vocab[n] = {d: display, w: 0}; }
  else if (!keepDisplay && vocab[n].d === n && display !== n){ vocab[n].d = display; }
  vocab[n].w = Math.max(vocab[n].w, w);
}

SENTENCES.forEach(function(s){ s.split(" ").forEach(function(w){ addWord(w, 5, true); }); });

// Pares de palabras (palabra anterior -> siguiente)
var BIG = {};
function addBig(map, a, b, k){ map[a] = map[a] || {}; map[a][b] = (map[a][b] || 0) + k; }
SENTENCES.forEach(function(s){
  var prev = "^";
  s.split(" ").forEach(function(w){ var n = norm(w); addBig(BIG, prev, n, 1); prev = n; });
});

var LKEY = "comunicador_v2";
var L = {u:{}, b:{}, d:{}};
try {
  var raw = JSON.parse(localStorage.getItem(LKEY) || "null");
  if (raw && raw.u) L = raw;
  else {
    var old = JSON.parse(localStorage.getItem("comunicador_aprendidas_v1") || "{}") || {};
    Object.keys(old).forEach(function(n){ if (old[n] && old[n].c) L.u[n] = old[n].c; if (old[n] && old[n].d) L.d[n] = old[n].d; });
  }
} catch(e){}
Object.keys(L.d).forEach(function(n){ if (!vocab[n]) vocab[n] = {d: L.d[n], w: 5}; });
function save(){ try { localStorage.setItem(LKEY, JSON.stringify(L)); } catch(e){} }
function learn(n, display){
  if (!n || isNum(n)) return;
  var prev = lastPrev();
  L.u[n] = (L.u[n] || 0) + 1;
  addBig(L.b, prev, n, 1);
  if (!vocab[n]){ vocab[n] = {d: display, w: 5}; L.d[n] = display; }
  save();
}
function W(n){ return (vocab[n] ? vocab[n].w : 0) + (L.u[n] || 0) * 25; }
function succ(prev){
  var m = {}, tot = 0;
  [BIG[prev] || {}, L.b[prev] || {}].forEach(function(src, k){
    Object.keys(src).forEach(function(n){ var c = src[n] * (k ? 2 : 1); m[n] = (m[n] || 0) + c; tot += c; });
  });
  Object.keys(m).forEach(function(n){ m[n] = m[n] / tot; });
  return m;
}

// Modelo de letras de respaldo
var LBIG = {};
Object.keys(vocab).forEach(function(n){
  var w = vocab[n].w, p = "^";
  for (var i = 0; i < n.length; i++){ addBig(LBIG, p, n[i], w); p = n[i]; }
});

// ---------- Predicción ----------
function suggest(prefix, prev){
  if (isNum(prefix) && prefix) return [];
  var p = succ(prev);
  var keys;
  if (!prefix){
    keys = Object.keys(p).sort(function(a,b){ return (p[b]-p[a]) || (W(b)-W(a)); });
  } else {
    keys = Object.keys(vocab).filter(function(n){ return n.indexOf(prefix) === 0; })
      .sort(function(a,b){ return ((p[b]||0)*1000 + W(b)) - ((p[a]||0)*1000 + W(a)); });
  }
  return keys.slice(0, 4).map(function(n){ return vocab[n] ? vocab[n].d : n; });
}
function letterScores(prefix, prev){
  var p = succ(prev), s = {}, any = false;
  Object.keys(vocab).forEach(function(n){
    if (n.length > prefix.length && n.indexOf(prefix) === 0){
      var c = n[prefix.length];
      if (ALL.indexOf(c) < 0) return;
      s[c] = (s[c] || 0) + W(n) + (p[n] || 0) * 5000; any = true;
    }
  });
  if (!any){
    var last = prefix ? prefix[prefix.length-1] : "^";
    var lb = LBIG[last] || {};
    Object.keys(lb).forEach(function(c){ s[c] = lb[c]; });
  }
  return s;
}
function ranked(set, prefix, prev){
  var s = letterScores(prefix, prev);
  return set.slice().sort(function(a,b){ return (s[b]||0) - (s[a]||0); });
}

var lastFire = 0;
function fire(fn){
  var t = Date.now();
  if (t - lastFire < 280) return;
  lastFire = t;
  try { if (navigator.vibrate) navigator.vibrate(20); } catch(_){}
  wake();
  fn();
}
// key: identificador estable para recuperar el foco después de redibujar.
function btn(content, className, fn, aria, disabled, key){
  var b = document.createElement("button");
  b.type = "button";
  b.className = (className || "") + (disabled ? " off" : "");
  if (typeof content === "string") b.textContent = content; else b.appendChild(content);
  if (aria) b.setAttribute("aria-label", aria);
  if (key) b.setAttribute("data-k", key);
  b.tabIndex = -1;                       // no usamos el orden de tabulación
  b._fn = disabled ? null : fn;          // deshabilitado = sigue pudiendo tener foco, pero no hace nada
  if (disabled) b.setAttribute("aria-disabled", "true");
  b.addEventListener("pointerdown", function(e){
    setKb(false);
    e.preventDefault();
    if (!b._fn) return;
    b.classList.add("pressed");
    try { b.setPointerCapture(e.pointerId); } catch(_){}
  });
  b.addEventListener("pointerup", function(e){
    b.classList.remove("pressed"); e.preventDefault();
    if (b._fn) fire(b._fn);
  });
  b.addEventListener("pointercancel", function(){ b.classList.remove("pressed"); });
  b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  return b;
}
function icon(path){
  var ns = "http://www.w3.org/2000/svg";
  var s = document.createElementNS(ns, "svg");
  s.setAttribute("viewBox","0 0 24 24");
  s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor"); s.setAttribute("stroke-width","2");
  s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round");
  s.innerHTML = path;
  return s;
}
function labeled(path, txt){
  var c = document.createElement("span"); c.className = "lab";
  c.appendChild(icon(path));
  var t = document.createElement("span"); t.textContent = txt; c.appendChild(t);
  return c;
}

// ---------- Navegación espacial con el control remoto ----------
function ovOpen(){ return $("ov").classList.contains("on"); }
function focusables(){
  var root = ovOpen() ? $("ov") : $("app");
  return Array.prototype.filter.call(root.querySelectorAll("button, .nav"), function(b){
    if (b.classList.contains("blank")) return false;
    var r = b.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  });
}
function byKey(k){
  if (!k) return null;
  var l = focusables();
  for (var i = 0; i < l.length; i++) if (l[i].getAttribute("data-k") === k) return l[i];
  return null;
}
function current(){
  var a = document.activeElement;
  return (a && a !== document.body && focusables().indexOf(a) >= 0) ? a : null;
}
// Rectángulo sin la escala del foco, para que agrandar el botón no altere la geometría.
function rectOf(b){
  var r = b.getBoundingClientRect(), s = 1;
  try {
    var tf = getComputedStyle(b).transform;
    if (tf && tf !== "none") s = new DOMMatrix(tf).a || 1;
  } catch(_){}
  if (s === 1) return {left:r.left, right:r.right, top:r.top, bottom:r.bottom};
  var cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2, hw = r.width / s / 2, hh = r.height / s / 2;
  return {left:cx-hw, right:cx+hw, top:cy-hh, bottom:cy+hh};
}
function focusEl(b){
  if (!b) return;
  try { b.focus({preventScroll: true}); } catch(_){ b.focus(); }
  lastKey = b.getAttribute("data-k"); lastRect = rectOf(b);
}
function defaultFocus(){
  if (ovOpen()) return byKey("ov-0") || focusables()[0];
  return byKey("pred-0") || byKey("let-0") || byKey("main-0") || focusables()[0];
}
function nearestTo(r){
  var cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2, best = null, bd = Infinity;
  focusables().forEach(function(b){
    var q = rectOf(b), dx = (q.left + q.right) / 2 - cx, dy = (q.top + q.bottom) / 2 - cy, d = dx*dx + dy*dy;
    if (d < bd){ bd = d; best = b; }
  });
  return best;
}
// Puntaje de un candidato b desde a en una dirección (menor = mejor; Infinity = no está en esa dirección).
function score(a, b, dir){
  var acx = (a.left + a.right) / 2, acy = (a.top + a.bottom) / 2;
  var bcx = (b.left + b.right) / 2, bcy = (b.top + b.bottom) / 2;
  var gap, orth, off;
  if (dir === "right" || dir === "left"){
    if (dir === "right"){ if (bcx <= acx + 1 || b.right <= a.right + 1) return Infinity; gap = b.left - a.right; }
    else { if (bcx >= acx - 1 || b.left >= a.left - 1) return Infinity; gap = a.left - b.right; }
    orth = Math.max(0, Math.max(a.top, b.top) - Math.min(a.bottom, b.bottom));
    off = Math.abs(bcy - acy);
  } else {
    if (dir === "down"){ if (bcy <= acy + 1 || b.bottom <= a.bottom + 1) return Infinity; gap = b.top - a.bottom; }
    else { if (bcy >= acy - 1 || b.top >= a.top - 1) return Infinity; gap = a.top - b.bottom; }
    orth = Math.max(0, Math.max(a.left, b.left) - Math.min(a.right, b.right));
    off = Math.abs(bcx - acx);
  }
  // Primero los que están alineados (se superponen en el otro eje); si no hay, los demás.
  return (orth > 0 ? 100000 : 0) + Math.max(0, gap) + orth * 2 + off * 0.3;
}
function bump(b){
  if (!b) return;
  b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
  setTimeout(function(){ b.classList.remove("bump"); }, 200);
}
function move(dir){
  var cur = current();
  if (!cur){ focusEl((lastRect && nearestTo(lastRect)) || defaultFocus()); return; }
  var a = rectOf(cur), best = null, bs = Infinity;
  focusables().forEach(function(b){
    if (b === cur) return;
    var s = score(a, rectOf(b), dir);
    if (s < bs){ bs = s; best = b; }
  });
  if (best) focusEl(best); else bump(cur);
}
function restoreFocus(oldKey, oldRect){
  var t = wantFocus ? (byKey(wantFocus) || defaultFocus())
    : (byKey(oldKey) || (oldRect && nearestTo(oldRect)) || defaultFocus());
  wantFocus = null;
  focusEl(t);
}

// ---------- Teclas: control remoto (desde Android) y teclado del navegador ----------
var lastMove = 0, lastOk = 0, lastBack = 0;
var MOVE_MS = 250, OK_MS = 400;
function onKey(k, repeat){
  var now = Date.now();
  wake();
  if (k === "up" || k === "down" || k === "left" || k === "right"){
    if (now - lastMove < MOVE_MS) return;
    lastMove = now;
    if (!kb){ setKb(true); if (!current()) focusEl(defaultFocus()); return; }
    move(k);
  } else if (k === "ok"){
    if (repeat || now - lastOk < OK_MS) return;   // rebote: ignorar un segundo OK muy seguido
    lastOk = now;
    setKb(true);
    var c = current();
    if (!c){ focusEl(defaultFocus()); return; }
    if (!c._fn){ bump(c); return; }
    lastFire = 0;
    fire(c._fn);
  } else if (k === "back"){
    if (repeat || now - lastBack < OK_MS) return;
    lastBack = now;
    if (ovOpen()) closeBig(); else undo();
  }
}
window.onRemoteKey = function(k, repeat){ onKey(String(k), !!repeat); return true; };

var KEYMAP = {ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
  Enter:"ok", NumpadEnter:"ok", " ":"ok", Backspace:"back", BrowserBack:"back", GoBack:"back"};
document.addEventListener("keydown", function(e){
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  var k = KEYMAP[e.key];
  if (e.key === "Escape"){ e.preventDefault(); if (ovOpen()) closeBig(); return; }
  if (e.key === "Tab"){ e.preventDefault(); return; }
  if (!k) return;
  e.preventDefault();
  onKey(k, e.repeat);
});
document.addEventListener("keyup", function(e){ if (KEYMAP[e.key]) e.preventDefault(); });
document.addEventListener("pointerdown", function(){ setKb(false); }, true);

// ---------- Render ----------
function renderMsg(){
  var m = $("msg"); m.innerHTML = "";
  if (!text && !word){
    var e = document.createElement("span"); e.className = "empty";
    e.textContent = "Elegí una palabra o empezá a escribir";
    m.appendChild(e);
  } else {
    m.appendChild(document.createTextNode(text));
    if (word){ var c = document.createElement("span"); c.className = "cur"; c.textContent = word; m.appendChild(c); }
  }
  m.scrollTop = m.scrollHeight;
  // El recuadro del mensaje también recibe foco: OK = hablar. (No se activa al tocarlo, para poder desplazarlo.)
  var box = $("msgbox");
  box._fn = (text || word) ? speakMsg : null;
  box.classList.toggle("off-msg", !box._fn);
}
function renderTop(){
  var t = $("topbtns"); t.innerHTML = "";
  var empty = !text && !word, armed = !!armedTimer;
  t.appendChild(btn(labeled(IC_SPEAK, "HABLAR"), "tb speak", speakMsg, "Hablar: leer el mensaje en voz alta", empty, "speak"));
  t.appendChild(btn(labeled(IC_BACK, "BORRAR"), "tb del", undo, "Borrar lo último", empty && !hist.length, "del"));
  t.appendChild(btn(labeled(IC_TRASH, armed ? "¿SEGURO?" : "TODO"), "tb trash" + (armed ? " armed" : ""), clearAll,
    armed ? "Tocá de nuevo para borrar todo" : "Borrar todo", empty, "trash"));
}
function renderPreds(){
  var p = $("preds"); p.innerHTML = "";
  var other = screen === "num" || screen === "phr" || screen === "words";
  p.className = "preds" + (other ? " other" : "");   // .other solo tiene estilo en vertical
  var list = other ? [] : suggest(norm(word), lastPrev());
  for (var i = 0; i < 3; i++){
    (function(d, i){
      if (d) p.appendChild(btn(d, "pred", function(){ pick(d); }, "Palabra " + d, false, "pred-" + i));
      else { var b = document.createElement("button"); b.className = "pred blank"; b.tabIndex = -1; p.appendChild(b); }
    })(list[i], i);
  }
}
function goScreen(s, focusKey){ screen = s; page = 0; wantFocus = focusKey; render(); }
function renderMain(){
  var main = $("main"); main.innerHTML = "";
  var prev = lastPrev();
  function grid(cols){ var g = document.createElement("div"); g.className = "grid " + cols; main.appendChild(g); return g; }
  function volver(){ main.appendChild(btn("← Volver", "strip", function(){ goScreen("main", "let-0"); }, "Volver a las letras", false, "volver")); }

  if (screen === "phr"){
    volver();
    var gp = grid("g3");
    FRASES.forEach(function(f, i){ gp.appendChild(btn(f, "phrase", function(){ insertText(f); }, null, false, "main-" + i)); });
    return;
  }
  if (screen === "words"){
    volver();
    var gw = grid("g4");
    SHORTCUTS.forEach(function(w, i){ gw.appendChild(btn(w, "short", function(){ insertText(w); }, null, false, "main-" + i)); });
    return;
  }
  if (screen === "num"){
    var g3 = grid("g3 numgrid");
    ["1","2","3","4","5","6","7","8","9",".","0","000"].forEach(function(d, i){
      g3.appendChild(btn(d, "numk", function(){ snap(); word += d; render(); }, "Número " + d, false, "main-" + i));
    });
    var abc = btn("ABC", "abc", function(){ if (word){ snap(); commitWord(); } goScreen("main", "let-0"); }, "Volver a las letras", false, "abc");
    abc.style.gridColumn = "span 2";
    g3.appendChild(abc);
    g3.appendChild(btn(labeled(IC_SPACE, "ESPACIO"), "enter", space, "Espacio: terminar el número", !word, "nspace"));
    return;
  }

  // Pantalla principal
  var wrap = document.createElement("div"); wrap.className = "ringwrap";
  var ring = document.createElement("div"); ring.className = "ring";
  wrap.appendChild(ring); main.appendChild(wrap);

  var rk = ranked(ALL, norm(word), prev);
  var first = !word;            // primera letra: 9 en grilla; después: 5 en círculo
  var per = first ? 9 : 5;
  var pages = Math.ceil(rk.length / per);
  if (page >= pages) page = 0;
  var letters = rk.slice(page*per, page*per+per);
  function letter(l, cls, i){
    var isV = VOWELS.indexOf(l) >= 0;
    return btn(l.toUpperCase(), cls + " " + (isV ? "vowel" : "cons"), function(){
      snap(); word += l; page = 0; screen = "main";
      wantFocus = "let-0";        // el foco va a la letra más probable
      render();
    }, "Letra " + l, false, "let-" + i);
  }
  if (first){
    var GW = 78, gap = 2, cw = (GW - 2*gap)/3, ch = (100 - 2*gap)/3;
    letters.forEach(function(l, i){
      var b = letter(l, "rg", i);
      b.style.width = cw + "%"; b.style.height = ch + "%";
      b.style.left = ((i % 3) * (cw + gap)) + "%";
      b.style.top = (Math.floor(i / 3) * (ch + gap)) + "%";
      ring.appendChild(b);
    });
  } else {
    var R = 28, S = 27, CX = 42;
    var ang = [252, 324, 36, 108, 180];
    letters.forEach(function(l, i){
      var t = ang[i] * Math.PI / 180;
      var b = letter(l, "rl", i);
      b.style.width = S + "%"; b.style.height = S + "%";
      b.style.left = (CX + R*Math.cos(t) - S/2) + "%";
      b.style.top = (50 + R*Math.sin(t) - S/2) + "%";
      ring.appendChild(b);
    });
  }
  // Columna fija a la derecha: MÁS, 123, ESPACIO
  ring.appendChild(btn(labeled(IC_MORE, "MÁS"), "rmore", function(){ page = (page+1) % pages; render(); }, "Más letras", false, "more"));
  ring.appendChild(btn("123", "rc", function(){
    if (word && !isNum(word)){ snap(); commitWord(); }
    goScreen("num", "main-0");
  }, "Números", false, "num"));
  ring.appendChild(btn(labeled(IC_SPACE, "ESPACIO"), "renter enter", space, "Espacio: terminar la palabra", !word, "space"));
}
function renderBar(){
  var bar = $("bar"); bar.innerHTML = "";
  bar.appendChild(btn("Frases", screen === "phr" ? "on" : "", function(){
    if (screen === "phr") goScreen("main", "let-0"); else goScreen("phr", "main-0");
  }, null, false, "bar-phr"));
  bar.appendChild(btn("Palabras", screen === "words" ? "on" : "", function(){
    if (screen === "words") goScreen("main", "let-0"); else goScreen("words", "main-0");
  }, null, false, "bar-words"));
  bar.appendChild(btn("Mostrar", "", showBig, "Mostrar el mensaje en grande", !text && !word, "bar-show"));
}
function renderCur(){
  var c = $("cur");
  if (word){ c.className = "curword"; c.textContent = word.toUpperCase(); }
  else { c.className = "curword idle"; c.textContent = "—"; }
}
function render(){
  var cur = current();
  var oldKey = cur ? cur.getAttribute("data-k") : lastKey;
  var oldRect = cur ? rectOf(cur) : lastRect;
  renderMsg(); renderTop(); renderCur(); renderPreds(); renderMain(); renderBar();
  if (!ovOpen()) restoreFocus(oldKey, oldRect);
}

// ---------- Acciones ----------
function commitWord(){
  if (!word) return;
  if (isNum(word)){ text += word + " "; }
  else {
    var n = norm(word);
    var d = vocab[n] ? vocab[n].d : word;
    learn(n, d);
    text += d + " ";
  }
  word = ""; page = 0;
}
function pick(display){
  snap();
  var n = norm(display);
  learn(n, display);
  text += display + " ";
  word = ""; page = 0; screen = "main"; render();
}
function insertText(str){
  snap();
  commitWord();
  str.split(" ").forEach(function(w){ var n = norm(w); learn(n, w); text += w + " "; });
  page = 0; screen = "main"; wantFocus = "pred-0"; render();
}
function space(){
  if (!word) return;
  snap();
  var wasNum = screen === "num";
  commitWord(); screen = "main";
  if (wasNum) wantFocus = "let-0";
  render();
}
// BORRAR (botón en pantalla y tecla Atrás): quita lo último que se agregó:
// una letra, una palabra predicha, una frase entera, o deshace "Borrar todo".
function undo(){
  disarm();
  if (hist.length){
    var s = hist.pop(); text = s.t; word = s.w;
  } else if (word){
    word = word.slice(0, -1);
  } else if (text){
    var t = text.replace(/\s+$/, ""), i = t.lastIndexOf(" ");
    text = i >= 0 ? t.slice(0, i + 1) : "";
  } else { bump(current()); return; }
  page = 0;
  if (word && isNum(word)) screen = "num";
  else if (screen === "num" && word) screen = "main";
  render();
}
function disarm(){ if (armedTimer){ clearTimeout(armedTimer); armedTimer = null; } }
function clearAll(){
  if (armedTimer){
    disarm();
    snap();                     // se puede recuperar con BORRAR / Atrás
    text = ""; word = ""; page = 0; screen = "main"; render();
  } else {
    armedTimer = setTimeout(function(){ armedTimer = null; render(); }, 3000);
    render();
  }
}
function fullMsg(){ return (text + word).trim(); }

// ---------- Mostrar en grande ----------
function showBig(){
  $("ovText").textContent = fullMsg();
  var ob = $("ovBar"); ob.innerHTML = "";
  ob.appendChild(btn("Leer en voz alta", "speak", speakMsg, null, false, "ov-0"));
  ob.appendChild(btn("Volver", "", closeBig, null, false, "ov-1"));
  $("ov").classList.add("on");
  focusEl(byKey("ov-0"));
}
function closeBig(){
  $("ov").classList.remove("on");
  focusEl(byKey("bar-show") || defaultFocus());
}

// ---------- Voz ----------
var toastTimer = null;
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 6000);
}
function noVoice(){
  toast("No hay voz disponible en este dispositivo. Revisá que esté instalado un motor de texto a voz en español.");
}
function speakMsg(){ speakText(fullMsg()); }
function speakText(t){
  if (!t) return;
  // 1) App de Android TV: puente nativo a TextToSpeech
  var A = window.AndroidTTS;
  if (A && typeof A.speak === "function"){
    try { if (A.speak(t) === false) noVoice(); return; } catch(e){}
  }
  // 2) Navegador: Web Speech API
  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined"){ noVoice(); return; }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = "es-AR"; u.rate = 0.9;
    var vs = window.speechSynthesis.getVoices().filter(function(v){ return /^es/i.test(v.lang); });
    var ar = vs.filter(function(v){ return /AR/i.test(v.lang); });
    var es = vs.filter(function(v){ return /ES/.test(v.lang); });
    if (ar.length) u.voice = ar[0]; else if (es.length) u.voice = es[0]; else if (vs.length) u.voice = vs[0];
    u.onerror = function(ev){ if (ev && ev.error && ev.error !== "canceled" && ev.error !== "interrupted") noVoice(); };
    window.speechSynthesis.speak(u);
  } catch(e){ noVoice(); }
}
function stopVoice(){
  try { if (window.AndroidTTS && window.AndroidTTS.stop) window.AndroidTTS.stop(); } catch(_){}
  try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch(_){}
}

// ---------- Pantalla siempre encendida (navegador; en el APK lo hace Android) ----------
var lock = null;
function wake(){
  try {
    if (!lock && navigator.wakeLock && document.visibilityState === "visible"){
      navigator.wakeLock.request("screen").then(function(l){
        lock = l; l.addEventListener("release", function(){ lock = null; });
      }).catch(function(){});
    }
  } catch(e){}
}
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") wake(); });

// Para pruebas automáticas
window.__comunicador = { state: function(){ return {text: text, word: word, screen: screen, hist: hist.length}; },
  focusables: focusables, stopVoice: stopVoice };

setKb(true);
render();
focusEl(defaultFocus());   // arranque predecible: primera predicción (o primera letra)
wake();
})();
</script>
